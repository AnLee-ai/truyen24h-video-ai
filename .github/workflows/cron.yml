name: Scheduled Chapter Writer (Auto Novel Generator)

on:
  schedule:
    # Tự động viết chương mới vào 06:00 Sáng & 18:00 Tối giờ Việt Nam (trước giờ render video 1 tiếng)
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    # Cho phép bấm chạy thủ công từ tab Actions
    inputs:
      novel_id:
        description: 'Novel ID (UUID từ Supabase, để trống để tự động chọn truyện đang viết)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 4. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Run Writing & Audio Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODEL_WRITER: ${{ secrets.GROQ_MODEL_WRITER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_NOVEL_ID: ${{ github.event.inputs.novel_id }}
          SECRET_NOVEL_ID: ${{ secrets.NOVEL_ID }}
        run: |
          python -u -c "
          import os
          from src import database, main
          
          novel_id = os.getenv('INPUT_NOVEL_ID') or os.getenv('SECRET_NOVEL_ID', '').strip()
          
          if novel_id:
              print(f'[INFO] Running writing pipeline for specified Novel ID: {novel_id}')
              main.run_chapter_pipeline(novel_id)
          else:
              print('[INFO] Auto-detecting active novel from Supabase...')
              novels = database.get_active_novels()
              if novels:
                  target_id = novels[0]['id']
                  print(f'[INFO] Selected active novel: {novels[0].get(\"title\", \"Untitled\")} (ID: {target_id})')
                  main.run_chapter_pipeline(target_id)
              else:
                  print('[WARNING] No active novel found in Supabase.')
          "

      - name: 6. Upload Generated Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: generated-chapter-audio
          path: output/
          retention-days: 7
