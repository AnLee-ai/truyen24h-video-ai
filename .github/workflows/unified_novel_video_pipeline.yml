name: Unified AI Novel Writing, Video Rendering & Telegram Studio

on:
  schedule:
    # Tự động chạy hàng ngày cứ mỗi 1 tiếng 1 lần (Chế độ Thử Nghiệm Continuous Studio Pipeline)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công từ tab Actions bất kỳ lúc nào
    inputs:
      novel_id:
        description: 'Novel ID (UUID từ Supabase, để trống để tự động chọn truyện đang viết)'
        required: false
        default: ''

jobs:
  unified-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 5. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth-oauthlib requests pydub Pillow

      - name: 6. Setup AI-auto-generate-video (If present)
        run: |
          if [ -d "AI-auto-generate-video" ]; then
            cd AI-auto-generate-video
            npm install
          fi

      - name: 7. Run Unified End-to-End AI Studio Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODEL_WRITER: ${{ secrets.GROQ_MODEL_WRITER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          INPUT_NOVEL_ID: ${{ github.event.inputs.novel_id }}
          SECRET_NOVEL_ID: ${{ secrets.NOVEL_ID }}
        run: python -u -m src.main

      - name: 8. Upload Artifacts (Audio, Subtitles & Videos Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-studio-media
          path: output/
          if-no-files-found: ignore
          retention-days: 7
