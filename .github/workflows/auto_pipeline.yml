name: Mangstoon Auto Production

on:
  schedule:
    # Ch?y 2 l?n m?i ngy (8:00 Sng v 20:00 T?i gi? Vi?t Nam = 01:00 v 13:00 UTC)
    - cron: '0 1,13 * * *'
  workflow_dispatch: # Cho php b?m nt ch?y th? cng trn giao di?n GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Ki?m tra m ngu?n (Checkout Repository)
      uses: actions/checkout@v4

    - name: Ci d?t Node.js (Cho Inkos)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Ci d?t Python (Cho Core & MoneyPrinter)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Ci d?t thu vi?n h? th?ng (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Ci d?t cc gi Python (Dependencies)
      run: |
        pip install -r requirements.txt
        pip install gradio_client # ? g?i Hugging Face

    - name: Ch?y quy trnh T? d?ng s?n xu?t (Auto Pipeline)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
      run: |
        PYTHONPATH=. python -m src.main --auto
