name: Auto AI Novel Video & YouTube Publishing Pipeline (Every 12 Hours)

on:
  schedule:
    # Tự động chạy cứ mỗi 12 tiếng một lần (07:00 Sáng & 19:00 Tối giờ Việt Nam)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công từ tab Actions trên GitHub
    inputs:
      novel_id:
        description: 'Novel ID (UUID từ Supabase, để trống để tự động lấy chương chờ)'
        required: false
        default: ''

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 5. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth-oauthlib

      - name: 6. Setup AI-auto-generate-video (If cloned)
        run: |
          if [ -d "AI-auto-generate-video" ]; then
            cd AI-auto-generate-video
            npm install
          fi

      - name: 7. Run High-Quality AI Video Pipeline (Every 12 Hours)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          NOVEL_ID: ${{ github.event.inputs.novel_id }}
        run: |
          python -c "
          import os
          from src import database, main
          
          input_novel_id = os.getenv('NOVEL_ID', '').strip()
          
          if input_novel_id:
              print(f'[INFO] Manual trigger for Novel ID: {input_novel_id}')
              main.run_chapter_pipeline(input_novel_id)
          else:
              print('[INFO] 12-Hour Scheduled Trigger: Checking Supabase for pending video chapters...')
              # Tìm chương mới nhất chưa tạo video do Scheduled Chapter Writer sinh ra
              pending_chap = database.get_pending_video_chapter()
              if pending_chap:
                  n_id = pending_chap.get('novel_id')
                  chap_num = pending_chap.get('chapter_number')
                  print(f'[INFO] Found pending chapter #{chap_num} for Novel ID: {n_id}')
                  main.run_chapter_pipeline(n_id)
              else:
                  print('[INFO] No pending chapters found. Running default pipeline...')
                  active_novels = database.get_active_novels()
                  if active_novels:
                      main.run_chapter_pipeline(active_novels[0]['id'])
                  else:
                      print('[WARNING] No active novels found in database.')
          "

      - name: 8. Upload Video Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/
          retention-days: 7
