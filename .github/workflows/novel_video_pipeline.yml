name: Auto AI Novel Video & YouTube Publishing Pipeline

on:
  schedule:
    # Tự động chạy hàng ngày lúc 12:00 UTC (19:00 giờ Việt Nam - Giờ Vàng YouTube)
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công từ tab Actions trên GitHub
    inputs:
      novel_id:
        description: 'Novel ID (UUID từ Supabase)'
        required: false
        default: ''

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 5. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth-oauthlib

      - name: 6. Setup AI-auto-generate-video (If cloned)
        run: |
          if [ -d "AI-auto-generate-video" ]; then
            cd AI-auto-generate-video
            npm install
          fi

      - name: 7. Run AI Video & Publishing Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOVEL_ID: ${{ github.event.inputs.novel_id }}
        run: |
          python -c "
          import os
          from src.main import run_chapter_pipeline
          novel_id = os.getenv('NOVEL_ID') or os.getenv('DEFAULT_NOVEL_ID', '')
          if novel_id:
              print(f'Starting workflow pipeline for Novel ID: {novel_id}')
              run_chapter_pipeline(novel_id)
          else:
              print('No Novel ID provided. Skipping automated run.')
          "

      - name: 8. Upload Video Artifacts (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/
          retention-days: 7
